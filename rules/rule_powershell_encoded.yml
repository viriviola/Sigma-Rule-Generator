title: Detection: PowerShell with Encoded Commands
status: experimental
description: Detects powershell.exe with suspicious command line arguments
references:
    - CISA AA23-136A
author: Threat Intel Pipeline
date: 2026-05-31
tags:
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-EncodedCommand'
            - '-WindowStyle Hidden'
    condition: selection
level: high
