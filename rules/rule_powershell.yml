title: Detection: PowerShell with Encoded Commands
status: experimental
references: [CISA AA23-136A]
date: 2026-05-31
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: '-EncodedCommand'
    condition: selection
level: high
