title: Detection: Suspicious Scheduled Task Creation
status: experimental
description: Detects schtasks.exe creating tasks
references:
    - CISA AA23-136A
author: Threat Intel Pipeline
date: 2026-05-31
tags:
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
level: medium
